name: BotFury CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r flask-dashboard/requirements.txt

      - name: Run Python tests
        run: pytest -v
        working-directory: flask-dashboard

      - name: Set up build JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x minecraft-bots/botfury-mod/gradlew

      - name: Build with Gradle and test
        run: ./gradlew build
        working-directory: minecraft-bots/botfury-mod

      - name: Verify build artifact
        run: |
          if [ ! -f "minecraft-bots/botfury-mod/build/libs/botfury-0.3.3.jar" ]; then
            echo "Build failed: JAR not found"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: botfury-jar
          path: minecraft-bots/botfury-mod/build/libs/botfury-0.3.3.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: botfury-jar
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: botfury-0.3.3.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
